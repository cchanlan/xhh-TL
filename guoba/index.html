<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>小火花模块中心</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><main>
<header class="hero"><div class="hero-brand"><img id="brand-icon" class="brand-icon" alt="小火花" hidden><div><span class="eyebrow">XHH · MODULES</span><h1>把需要的功能，装进小火花<span class="spark">✦</span></h1></div></div><div class="header-actions"><button id="refresh" class="secondary">↻ 刷新目录</button><a id="settings" href="#">插件设置 ↗</a></div></header>
<section class="notice" aria-label="安装说明"><span class="notice-icon">◷</span><div><strong>准备完成后，重启机器人生效</strong><span>卸载保留账号、配置和订阅。这里不会自动重启你的机器人。</span></div></section>
<section id="operation" class="operation" role="status" aria-live="polite" hidden><span id="operation-text"></span><div><button id="migrate" hidden>迁移旧版功能</button><button id="cancel-pending" class="secondary" hidden>取消待重启变更</button></div></section>
<section class="toolbar" aria-label="筛选模块"><div class="tabs" role="group" aria-label="安装状态"><button data-filter="all" class="selected" aria-pressed="true">全部</button><button data-filter="installed" aria-pressed="false">已安装</button><button data-filter="available" aria-pressed="false">未安装</button></div><div class="search-tools"><select id="category" aria-label="模块类型"><option value="all">全部类型</option><option value="feature">功能模块</option><option value="assets">素材图库</option></select><input id="search" type="search" placeholder="搜索你需要的功能…" aria-label="搜索模块"></div></section>
<div class="section-heading"><h2 id="list-title">发现模块</h2><span id="result-label">正在读取…</span></div><section id="modules" class="grid" aria-label="可安装模块" aria-busy="true"></section><section id="empty" class="empty" hidden>没有匹配的模块，换个关键词试试。</section><section id="error" class="error" role="alert" hidden><p id="error-text"></p><button id="retry">重新读取</button></section>
<footer>小火花 · 按需安装，自由组合 <span>核心与功能模块分别更新</span></footer>
</main>
<div id="modal" class="modal" hidden><section role="dialog" aria-modal="true" aria-labelledby="dialog-title" class="dialog" tabindex="-1"><span class="eyebrow">确认操作</span><h2 id="dialog-title"></h2><p id="dialog-note"></p><ul id="dialog-changes"></ul><p id="dialog-size" class="muted"></p><div class="dialog-actions"><button id="dismiss" class="secondary">再想想</button><button id="confirm">确认</button></div></section></div>
</body></html>
