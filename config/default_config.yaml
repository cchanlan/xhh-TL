# xhh-TL 默认配置（随仓库更新）
# 用户请改 config/config.yaml（不会被 git 覆盖）
# 首次启动会自动从本文件复制生成 config.yaml

# 出图和提示是否引用触发指令的那条消息（关掉就单独发，不带引用）
reply_quote: true
Tl: true
# 全局倍率微调：1.0=模板推荐倍率；可调 0.8~1.5，最终 scale 上限 2.5
render_scale: 1.0
# 体力卡片样式（原神/星铁/绝区零均生效）
#   classic  = 经典多合一卡片（默认）
#   portrait = 大立绘卡片（右侧角色立绘：原神/星铁走 miao，绝区零走 zzzrole）
#   widget   = 桌面小组件竖卡（仿米哈游官方桌面小组件，顶部立绘复用同一目录）
tl_card_style: classic
# 立绘卡的立绘目录（tl_card_style=portrait/widget 时生效，仅原神/星铁）
# 默认用 miao-plugin 角色面板图，按游戏自动过滤原神/星铁角色
# 结构：子文件夹=角色名，内含图片随机抽取。也可改成自己的图库或绝对路径
tl_portrait_folder: plugins/miao-plugin/resources/profile/normal-character
# 绝区零立绘目录（tl_card_style=portrait/widget 时生效）
# 默认插件内置 resources/zzzrole（平铺 IconRole*.png/webp）；可改成自己的图库或绝对路径
tl_zzz_portrait_folder: plugins/xhh-TL/resources/zzzrole
# 鸣潮立绘目录（tl_card_style=portrait/widget 时生效）
# 默认插件内置 resources/ww_role_pile（子文件夹=角色ID，内含立绘随机抽取）
tl_ww_portrait_folder: plugins/xhh-TL/resources/ww_role_pile
# 立绘卡的底图（tl_card_style=portrait 时生效；widget 竖卡不使用底图）
# 支持：单张图片文件 / 目录（目录则随机抽一张）；相对 Yunzai 根或绝对路径
tl_portrait_bg: plugins/xhh-TL/resources/stat/imgs/bg1.png
# 桌面小组件卡（tl_card_style=widget）底部是否显示「限时活动」区块
# 星铁/绝区零：数据取自体力 widget 接口自带字段，零额外请求
# 原神：widget 接口不返回活动，需完整 CK 额外拉取 act_calendar；失败静默隐藏，不影响出图
tl_widget_activity: true
# 限时活动最多显示几条
tl_widget_activity_limit: 4
tl_priority: -999
show_all_bindings: true
tl_render_mode: merge
tl_merge_uids_per_image: 0
tl_uids_per_image: 2
tl_cards_per_msg: 3

# ===== 鸣潮体力（自己请求库街区，凭证借 gsuid_core 的鸣潮插件）=====
# 总开关：开了以后 #体力 总览可附带鸣潮体力，另外还要用户自己 #开启鸣潮体力（默认关）
# 单独 #鸣潮体力 只受本开关约束。出图用本插件模板，与三游戏同款
waves_tl_enable: false
# gsuid_core 的 GsData.db 文件路径（只读打开，取鸣潮绑定 wavesbind 与凭证 wavesuser）
# 留空自动探测 Linux 默认路径；Windows 推荐 D:/QingShuiBot/gsuid_core/data/GsData.db
# 反斜杠会自动归一化；多个路径用换行、逗号或分号分隔，按顺序尝试存在的路径
# Docker/WSL 请填写 Yunzai 进程实际可见的路径
waves_tl_gsuid_db: ""
# 请求库街区接口的超时（秒）
waves_tl_timeout: 15
abyss_priority: -98
all_abyss: true
all_abyss_render_mode: desktop
role_combat: true
# 剧诗/小剧诗/原神全部深渊 背景（目录或单张图）
# 默认用插件自带图，Linux/Win 通用相对路径：
#   plugins/xhh-TL/resources/stat/imgs/bg1.png
# 也可改成角色面板目录（子文件夹=角色名，随机抽图），例如：
#   plugins/miao-plugin/resources/profile/normal-character
# Windows 也可用绝对路径：D:/Yunzai/plugins/...
role_combat_bg_folder: plugins/xhh-TL/resources/stat/imgs/bg1.png
gs_all_abyss: true
# 原神全部深渊毛玻璃主题：light=初版浅色玻璃 / dark=深色半透明
gs_all_abyss_theme: light

# 原神深渊配队（#深渊配队）：提瓦特小助手数据 + 本人练度排序
abyss_team: true
# 深渊配队毛玻璃主题：留空跟随「全部深渊主题」/ light 浅色 / dark 深色
abyss_team_theme: ""
abyss_team_priority: -98

# 幽境危战配队（#危战配队）：提瓦特小助手幽境危战统计 + 本人练度排序
hard_team: true
# 危战配队毛玻璃主题：留空跟随「全部深渊主题」/ light 浅色 / dark 深色
hard_team_theme: ""
hard_team_priority: -98

# 角色持有率（#角色持有率）：提瓦特小助手深渊统计的角色持有比例
hold_rate: true
# 角色持有率毛玻璃主题：留空跟随「全部深渊主题」/ light 浅色 / dark 深色
hold_rate_theme: ""
hold_rate_priority: -98

# ===== 队伍伤害（#队伍伤害）=====
# 提瓦特小助手的队伍伤害计算，面板取 miao-plugin 的角色面板缓存（需先 #更新面板）
#   基础：#队伍伤害 钟离,班尼特,香菱,行秋
#   自定义手法：队伍后面直接接动作，如 … 钟离e,班尼特q,香菱q,行秋q,行秋e
#              动作可写 e / 长e / 短e / q / zj(重击) / a1~a6，同一角色连招可省略角色名
#   换装模拟：角色名后接「换…」，如 香菱换六命换精5换天赋101313 / 行秋换讨龙换4千岩
#   加「详情」出逐条伤害表：#队伍伤害详情 …
team_damage: true
# 默认 -98：比 FanSky_Qs 的同名指令（3141）优先，同装两个插件时由本插件出图
team_damage_priority: -98
# 接口超时（秒）。手法长、队伍复杂时小助手算得慢，别调太小
team_damage_timeout: 20

# 帮助图背景（#小火花帮助）
# 默认插件自带 bg2.png，Linux/Win 通用相对路径：
#   plugins/xhh-TL/resources/stat/imgs/bg2.png
# 可改成任意单张图，也支持目录（随机抽一张）
# Windows 也可用绝对路径：D:/Yunzai/plugins/xhh-TL/resources/stat/imgs/bg2.png
help_bg: plugins/xhh-TL/resources/stat/imgs/bg2.png

# SToken/CK 搜索路径（多行，按优先级）。留空则用默认 xhh / 逍遥 / 本插件
# stoken_paths: |
#   plugins/xhh/data/Stoken
#   plugins/xiaoyao-cvs-plugin/data/yaml
#   plugins/xhh-TL/data/Stoken
stoken_paths: ""

# data/tmp 定时清理
tmp_clean_enable: true
tmp_clean_cron: "17 4 * * *"
tmp_clean_max_age_hours: 24

# ===== 体力阈值推送 =====
# 用户在群里各自设定阈值：原神看原粹树脂、星铁看开拓力，达到即在该群@用户并发体力图
# 达到阈值只提醒一次，体力回落到阈值以下后自动重新监控
resin_push_enable: true
# 检查频率（cron）。默认每 10 分钟一次；不建议太频繁以免触发米游社风控
resin_push_cron: "*/10 * * * *"

# ===== 米游社自动签到 =====
# 用户 opt-in 订阅：发 #原神自动签到 后才纳入每日自动签（星铁/绝区零同理）
# 签到走稳定 device_id + 真 device_fp，触发验证码概率低；仍可能偶发验证码而跳过
# 手动：#原神签到 / #星铁签到 / #绝区零签到 立即签一次
auto_sign_enable: true
# 每日签到时间（cron）。默认 00:23，避开整点风控高峰；建议 0-6 点随机分钟
auto_sign_cron: "23 0 * * *"
# 签到完成汇总图毛玻璃主题：留空跟随「全部深渊主题」/ light 浅色 / dark 深色
auto_sign_theme: ""
# 手动签到撞验证码时的「外部打码服务」地址（内置过码，装了本插件即可删掉 GT-Manual）
# ⚠️ 过码会把 uid+gt+challenge 发给该第三方服务（不含 cookie）；服务下线/限流则过码失效
# 留空则撞码只提示、不自动过码。默认沿用 GT-Manual 的公益地址
# 仅手动 #原神签到 等实时指令生效；定时自动签无人手划，撞码只跳过
auto_sign_verify_addr: "https://GT.928100.xyz/GTest/register?key=免费开源项目-您如果是交易获得则是被骗-请及时退款并举报"

# ===== 米游币社区任务 =====
# 与上面的「自动签到」是两回事：签到领原石走游戏 UID + cookie_token；
# 米游币是社区做任务（版块签到+看帖+点赞+分享）赚币，走米游社账号 + stoken
# 用户 opt-in 订阅：发 #开启自动米游币 后才纳入每日自动任务
# 手动：#米游币签到 立即跑一次；#米游币余额 只查余额
# ⚠️ 需要 stoken（#扫码登录才有），普通 CK 做不了米游币任务
bbs_coin_enable: true
# 每日执行时间（cron）。凌晨 00:50
bbs_coin_cron: "50 0 * * *"
# 做哪些版块，逗号分隔：gs=原神 sr=星铁 zzz=绝区零
# 米游币每日上限通常单版块即可拿满；版块越多耗时越长、风控概率略高
bbs_coin_games: "gs,sr,zzz"
# 米游币汇总图毛玻璃主题：留空跟随「自动签到主题 / 全部深渊主题」/ light 浅色 / dark 深色
bbs_coin_theme: ""
# gsuid_core 数据库路径（可选）。米游币要 stoken，而 gsuid #扫码登录的 stoken 存在它的 GsData.db 里，
# 且带该账号注册过的真实 device_id/fp，比现派生的更不容易被风控，故优先读它。
# 留空则自动探测 /opt/gsuid_core/data/GsData.db 与 /root/gsuid_core/data/GsData.db
# 多个路径用换行或逗号分隔；只读打开，不会写入或锁库
bbs_coin_gsuid_db: ""
