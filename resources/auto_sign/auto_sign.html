<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style id="as-inline">
* { margin: 0; padding: 0; box-sizing: border-box; }
@font-face {
  font-family: 'NotoSansSC';
  src: url('../../../../plugins/xhh-TL/resources/font/NotoSansCJKsc-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

html, body {
  width: 900rem;
  margin: 0;
  padding: 0;
  background: #07090f;
}

body {
  color: #e8eaf0;
  font-family: 'NotoSansSC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  transform-origin: 0 0;
}

.as-page {
  position: relative;
  width: 900rem;
  box-sizing: border-box;
  min-height: 300rem;
  padding: 26rem 28rem 20rem;
  overflow: hidden;
  background-color: #0b0f18;
  background-image:
    linear-gradient(165deg, rgba(11, 15, 24, 0.72) 0%, rgba(10, 13, 20, 0.78) 45%, rgba(8, 10, 16, 0.85) 100%),
    var(--as-bg, none);
  background-size: cover, cover;
  background-position: center, center;
  background-repeat: no-repeat, no-repeat;
}

.as-glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(70rem);
  pointer-events: none;
  opacity: 0.4;
}
.as-glow.a { width: 280rem; height: 280rem; background: #3d7eff; top: -80rem; right: -40rem; }
.as-glow.b { width: 220rem; height: 220rem; background: #7b61ff; bottom: 40rem; left: -60rem; }

/* ============ 顶部完成横幅 ============ */
.as-head {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16rem;
  margin-bottom: 20rem;
  padding: 18rem 22rem;
  border-radius: 18rem;
  background: rgba(18, 24, 38, 0.6);
  border: 1rem solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 10rem 30rem rgba(0, 0, 0, 0.25);
}
.as-head-left { display: flex; align-items: center; gap: 16rem; min-width: 0; }
.as-head-icon {
  width: 56rem; height: 56rem; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 14rem;
  background: rgba(88, 166, 255, 0.14);
  border: 1rem solid rgba(88, 166, 255, 0.26);
}
.as-head-icon img { width: 38rem; height: 38rem; object-fit: contain; }
.as-head-emoji { font-size: 30rem; }
.as-head-text { min-width: 0; }
.as-title {
  font-size: 28rem; font-weight: 800; color: #fff;
  letter-spacing: -0.01em; line-height: 1.15;
}
.as-sub {
  margin-top: 6rem;
  font-size: 14rem; color: #9aa6c0;
}
.as-sub .warn { color: #ffb86b; font-weight: 700; }
.as-avatars { display: flex; align-items: center; flex-shrink: 0; }
.as-avatars .av {
  width: 44rem; height: 44rem; border-radius: 50%;
  object-fit: cover; margin-left: -10rem;
  border: 2rem solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 2rem 8rem rgba(0, 0, 0, 0.35);
}
.as-avatars .av:first-child { margin-left: 0; }

/* ============ 签到列表卡片 ============ */
.as-card {
  position: relative;
  z-index: 1;
  padding: 16rem 18rem 8rem;
  border-radius: 18rem;
  background: rgba(14, 18, 28, 0.7);
  border: 1rem solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 10rem 30rem rgba(0, 0, 0, 0.22);
  backdrop-filter: blur(12rem);
  -webkit-backdrop-filter: blur(12rem);
}
.as-card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8rem;
}
.as-card-title {
  font-size: 18rem; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 8rem;
}
.as-card-meta { font-size: 13rem; color: #7a8499; }

/* ============ 表格 ============ */
.as-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 15rem;
}
.as-table th {
  padding: 12rem 8rem;
  font-size: 13rem; font-weight: 600; color: #8b93a7;
  text-align: center;
  border-bottom: 1rem solid rgba(255, 255, 255, 0.1);
}
.as-table td {
  padding: 16rem 8rem;
  text-align: center;
  border-bottom: 1rem solid rgba(255, 255, 255, 0.05);
  vertical-align: middle;
}
.as-table tbody tr:last-child td { border-bottom: none; }

.c-idx { width: 48rem; color: #7a8499; font-weight: 600; font-size: 14rem; }
/* 固定列宽 + flex 靠左，图标起点不随游戏名字数浮动 */
.as-table td.c-game { width: 260rem; text-align: left; padding-left: 16rem; }
.c-game .g-cell { display: flex; align-items: center; gap: 12rem; }
.c-game .g-cell img {
  width: 40rem; height: 40rem; flex-shrink: 0;
  object-fit: cover; border-radius: 10rem;
  background: rgba(255, 255, 255, 0.06);
  box-shadow: 0 0 0 1rem rgba(255, 255, 255, 0.08);
}
.c-game .g-name { font-weight: 700; color: #f2f5ff; font-size: 16rem; }

.n-ok { color: #4ad2a0; font-weight: 800; }
.n-fail { color: #8b93a7; font-weight: 600; }
.n-fail.bad { color: #ff6b6b; font-weight: 800; }

.as-foot {
  position: relative;
  z-index: 1;
  margin-top: 16rem;
  text-align: center;
  font-size: 12rem; color: #5c6478;
  letter-spacing: 0.04em;
}
  </style>
  <style id="rem-root">html { font-size: {{scalePx}}px; }</style>
</head>
<body>
  <div class="as-page" id="container" {{if bgImage}}style="--as-bg:url('{{bgImage}}')"{{/if}}>
    <div class="as-glow a"></div>
    <div class="as-glow b"></div>

    <!-- 顶部完成横幅 -->
    <div class="as-head">
      <div class="as-head-left">
        <div class="as-head-icon">
          {{if signIcon}}<img src="{{signIcon}}" alt="" />{{else}}<span class="as-head-emoji">📅</span>{{/if}}
        </div>
        <div class="as-head-text">
          <div class="as-title">米游社自动签到完成</div>
          <div class="as-sub">总耗时: {{totalCost}}，未签 <span class="{{if unsigned}}warn{{/if}}">{{unsigned}}</span></div>
        </div>
      </div>
      <div class="as-avatars">
        {{each headerIcons ic}}
        <img class="av" src="{{ic}}" alt="" />
        {{/each}}
      </div>
    </div>

    <!-- 签到列表 -->
    <div class="as-card">
      <div class="as-card-head">
        <div class="as-card-title">📋 签到列表</div>
        <div class="as-card-meta">{{generatedAt}}</div>
      </div>
      <table class="as-table">
        <thead>
          <tr>
            <th class="c-idx">#</th>
            <th class="c-game" style="text-align:left;padding-left:16rem;">签到游戏</th>
            <th>成功</th>
            <th>失败</th>
          </tr>
        </thead>
        <tbody>
          {{each rows r idx}}
          <tr>
            <td class="c-idx">{{idx + 1}}</td>
            <td class="c-game">
              <div class="g-cell">
                {{if r.icon}}<img src="{{r.icon}}" alt="" />{{/if}}<span class="g-name">{{r.name}}</span>
              </div>
            </td>
            <td class="n-ok">{{r.ok}}</td>
            <td class="n-fail {{if r.fail}}bad{{/if}}">{{r.fail}}</td>
          </tr>
          {{/each}}
        </tbody>
      </table>
    </div>

    <div class="as-foot">小火花 · 米游社自动签到 · {{generatedAt}}</div>
  </div>
</body>
</html>
